<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TestHub - Service Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 48px; margin-bottom: 20px; }
        .status { font-size: 24px; margin: 20px 0; }
        .success { color: #4ade80; }
        .links { margin-top: 30px; }
        .links a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .links a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .test-form { margin-top: 30px; }
        .test-form input {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            margin: 5px;
            font-size: 16px;
        }
        .test-form button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4ade80;
            color: #1a1a1a;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        .test-form button:hover {
            background: #22c55e;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: left;
            font-family: monospace;
            white-space: pre-wrap;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ TestHub 服务状态</h1>
        <div class="status">所有服务正在运行</div>
        
        <div class="test-form">
            <h3>登录测试</h3>
            <input type="text" id="username" placeholder="用户名" value="testuser">
            <input type="password" id="password" placeholder="密码" value="test123456">
            <button onclick="testLogin()">测试登录</button>
        </div>
        
        <div id="result"></div>
        
        <div class="links">
            <a href="/">主应用</a>
            <a href="/api/docs/" target="_blank">API文档</a>
            <a href="/admin/" target="_blank">管理后台</a>
        </div>
    </div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');
            
            result.textContent = '正在测试登录...';
            
            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                result.textContent = `状态码: ${response.status}\n响应: ${JSON.stringify(data, null, 2)}`;
                result.style.color = response.ok ? '#4ade80' : '#f87171';
            } catch (error) {
                result.textContent = `错误: ${error.message}`;
                result.style.color = '#f87171';
            }
        }
        
        // 页面加载时自动测试
        window.onload = () => {
            testLogin();
        };
    </script>
</body>
</html>
